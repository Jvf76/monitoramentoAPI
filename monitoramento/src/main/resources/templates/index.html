<!doctype html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Monitoramento Industrial</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #f3f6f9;
            color: #1f2937;
            font-family: Arial, sans-serif;
        }

        .container {
            width: min(1100px, 92%);
            margin: 40px auto;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 30px;
        }

        header h1 {
            margin-bottom: 6px;
            font-size: 28px;
        }

        header p {
            color: #64748b;
        }

        button {
            padding: 12px 20px;
            border: 0;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .card {
            margin-bottom: 30px;
            padding: 24px;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            background: white;
            box-shadow: 0 4px 14px rgba(15, 23, 42, 0.06);
        }

        .card.alerta {
            border-left: 6px solid #dc2626;
        }

        .card.normal {
            border-left: 6px solid #16a34a;
        }

        .card h2 {
            margin-bottom: 20px;
            font-size: 20px;
        }

        .metrics {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
        }

        .metric {
            padding: 16px;
            border-radius: 8px;
            background: #f8fafc;
        }

        .metric-label {
            display: block;
            margin-bottom: 8px;
            color: #64748b;
            font-size: 13px;
        }

        .metric-value {
            font-size: 20px;
            font-weight: bold;
        }

        .normal-text {
            color: #15803d;
        }

        .alert-text {
            color: #dc2626;
        }

        .empty {
            padding: 24px;
            border-radius: 8px;
            background: white;
            color: #64748b;
            text-align: center;
        }

        .history {
            overflow: hidden;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            background: white;
            box-shadow: 0 4px 14px rgba(15, 23, 42, 0.06);
        }

        .history h2 {
            padding: 22px;
            border-bottom: 1px solid #e2e8f0;
            font-size: 20px;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 15px 20px;
            border-bottom: 1px solid #e2e8f0;
            text-align: left;
        }

        th {
            background: #f8fafc;
            color: #475569;
            font-size: 13px;
            text-transform: uppercase;
        }

        tr:last-child td {
            border-bottom: 0;
        }

        tr.alert-row {
            background: #fef2f2;
        }

        .status {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .status-normal {
            background: #dcfce7;
            color: #166534;
        }

        .status-alerta {
            background: #fee2e2;
            color: #991b1b;
        }

        .error-message {
            margin-bottom: 24px;
            padding: 14px 18px;
            border: 1px solid #fecaca;
            border-radius: 8px;
            background: #fef2f2;
            color: #991b1b;
            font-weight: bold;
        }

        @media (max-width: 800px) {
            header {
                align-items: flex-start;
                flex-direction: column;
            }

            .metrics {
                grid-template-columns: 1fr 1fr;
            }
        }

        @media (max-width: 520px) {
            .metrics {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
<main class="container">

    <header>
        <div>
            <h1>Monitoramento Industrial</h1>
            <p>Temperatura e eficiência da máquina em tempo real</p>
        </div>

        <form th:action="@{/atualizar}" method="post">
            <button type="submit">Atualizar leitura</button>
        </form>
    </header>

    <div class="error-message"
         th:if="${erro != null}"
         th:text="${erro}">
    </div>

    <section th:if="${leituraAtual != null}"
             class="card"
             th:classappend="${leituraAtual.anormal} ? 'alerta' : 'normal'">

        <h2>Leitura atual</h2>

        <div class="metrics">
            <div class="metric">
                <span class="metric-label">Temperatura</span>

                <span class="metric-value"
                      th:text="|${#numbers.formatDecimal(leituraAtual.temperatura, 1, 1)} °C|">
                </span>
            </div>

            <div class="metric">
                <span class="metric-label">Eficiência</span>

                <span class="metric-value"
                      th:text="|${#numbers.formatDecimal(leituraAtual.eficiencia, 1, 1)}%|">
                </span>
            </div>

            <div class="metric">
                <span class="metric-label">Data e hora</span>

                <span class="metric-value"
                      th:text="${#temporals.format(
                          leituraAtual.dataHora,
                          'dd/MM/yyyy HH:mm:ss'
                      )}">
                </span>
            </div>

            <div class="metric">
                <span class="metric-label">Situação</span>

                <span class="metric-value"
                      th:classappend="${leituraAtual.anormal}
                          ? 'alert-text'
                          : 'normal-text'"
                      th:text="${leituraAtual.anormal}
                          ? 'Anormal'
                          : 'Normal'">
                </span>
            </div>
        </div>
    </section>

    <section th:if="${leituraAtual == null}" class="empty">
        Nenhuma leitura registrada. Clique em “Atualizar leitura”.
    </section>

    <section class="history">
        <h2>Histórico de leituras</h2>

        <div class="table-wrapper">
            <table>
                <thead>
                <tr>
                    <th>Data e hora</th>
                    <th>Temperatura</th>
                    <th>Eficiência</th>
                    <th>Situação</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="leitura : ${historico}"
                    th:classappend="${leitura.anormal}
                        ? 'alert-row'
                        : ''">

                    <td th:text="${#temporals.format(
                            leitura.dataHora,
                            'dd/MM/yyyy HH:mm:ss'
                        )}">
                    </td>

                    <td th:text="|${#numbers.formatDecimal(
                            leitura.temperatura,
                            1,
                            1
                        )} °C|">
                    </td>

                    <td th:text="|${#numbers.formatDecimal(
                            leitura.eficiencia,
                            1,
                            1
                        )}%|">
                    </td>

                    <td>
                        <span class="status"
                              th:classappend="${leitura.anormal}
                                  ? 'status-alerta'
                                  : 'status-normal'"
                              th:text="${leitura.anormal}
                                  ? 'Anormal'
                                  : 'Normal'">
                        </span>
                    </td>
                </tr>

                <tr th:if="${#lists.isEmpty(historico)}">
                    <td colspan="4">
                        Nenhuma leitura disponível.
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>

</main>
</body>
</html>
